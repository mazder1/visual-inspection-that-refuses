[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinspect"
version = "0.1.0"
description = "Defect segmentation that abstains when the evidence is weak"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "pillow>=10.0",
    "numpy>=1.24",
    # Region extraction and the interior/persistence statistics.
    "scipy>=1.10",
    # Used only by the split generator, to recover component identity that
    # MVTec AD does not ship. Not a training-time dependency.
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

dev = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: trains a model; deselect with -m 'not slow'",
]
